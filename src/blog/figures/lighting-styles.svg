<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="ls-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B3A3F"/><stop offset="1" stop-color="#0B1C1F"/></linearGradient>
<linearGradient id="ls-metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2E4C2"/><stop offset=".5" stop-color="#C9B07A"/><stop offset="1" stop-color="#E4D3AD"/></linearGradient>
<linearGradient id="ls-cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE2B0" stop-opacity=".55"/><stop offset="1" stop-color="#FFE2B0" stop-opacity=".04"/></linearGradient>
<filter id="ls-glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="11"/></filter>
<filter id="ls-soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter>
</defs>
<!-- front-lit -->
<rect x="16" y="16" width="192" height="206" rx="2" fill="url(#ls-wall)"/>
<rect x="104" y="40" width="16" height="12" rx="2" fill="#3A4A4D"/>
<path d="M106 52L118 52L178 190L46 190Z" fill="url(#ls-cone)"/>
<rect x="56" y="104" width="112" height="56" rx="1" fill="url(#ls-metal)" stroke="#8C7442" stroke-width=".8"/>
<path d="M76 132H148" stroke="#5C4A26" stroke-width="5" stroke-linecap="round" opacity=".75"/>
<!-- halo -->
<rect x="224" y="16" width="192" height="206" rx="2" fill="url(#ls-wall)"/>
<rect x="258" y="96" width="124" height="72" rx="10" fill="#FFD9A0" opacity=".85" filter="url(#ls-glow)"/>
<rect x="264" y="104" width="112" height="56" rx="1" fill="#0C1517" stroke="#E9D3A0" stroke-opacity=".75" stroke-width="1"/>
<path d="M284 132H356" stroke="#22383C" stroke-width="5" stroke-linecap="round"/>
<!-- face-lit -->
<rect x="432" y="16" width="192" height="206" rx="2" fill="url(#ls-wall)"/>
<rect x="472" y="104" width="112" height="56" rx="1" fill="#0C1517" stroke="#31464A"/>
<text class="fx" x="528" y="150" font-size="44" text-anchor="middle" fill="#FFD9A0" filter="url(#ls-soft)" style="fill:#FFD9A0">24</text>
<text class="fx" x="528" y="150" font-size="44" text-anchor="middle" style="fill:#FFF1D6">24</text>
<text class="fl" x="112" y="258" font-size="20" text-anchor="middle">Front-lit</text>
<text class="fl" x="320" y="258" font-size="20" text-anchor="middle">Halo backlit</text>
<text class="fl" x="528" y="258" font-size="20" text-anchor="middle">Face-lit</text>
<text class="fn" x="112" y="284" font-size="18" text-anchor="middle">a lamp lights the face</text>
<text class="fn" x="320" y="284" font-size="18" text-anchor="middle">glow on the wall behind</text>
<text class="fn" x="528" y="284" font-size="18" text-anchor="middle">the face itself glows</text>
</svg>
